name: Build Omni APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android Native APK
        run: |
          npm install -g cordova
          cordova telemetry off
          cordova create app com.omni.ai OmniAI
          cd app
          rm -rf www/*
          cp ~/../..$GITHUB_WORKSPACE/index.html www/index.html
          cordova platform add android --no-telemetry
          cordova build android --debug --no-telemetry

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: OmniAI-Debug-APK
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
